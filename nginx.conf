server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 加载默认 MIME 类型（否则 index.html 会变成 octet-stream）
    include /etc/nginx/mime.types;

    # WAV 音频 MIME 类型
    types {
        audio/wav wav;
    }

    # Vite 带 content hash 的静态资源 → 长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # public 图片
    location /pic/ {
        expires 7d;
    }

    # public 音频
    location /music/ {
        expires 7d;
    }

    # favicon
    location /favicon.ico {
        expires 7d;
    }

    # SPA 路由回退：所有非文件请求返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
